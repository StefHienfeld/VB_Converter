[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Note: Add --cov flags when pytest-cov is installed:
# pytest --cov=hienfeld --cov=hienfeld_api --cov-report=term-missing --cov-report=html:coverage_html
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Coverage configuration
[coverage:run]
source = hienfeld,hienfeld_api
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
show_missing = true
