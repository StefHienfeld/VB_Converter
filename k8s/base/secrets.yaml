# =============================================================================
# VB CONVERTER - KUBERNETES SECRETS
# =============================================================================
# Gevoelige configuratie voor de applicatie.
# BELANGRIJK: Vul NOOIT echte secrets in in dit bestand!
#
# Dit is een TEMPLATE. Gebruik een van de volgende methoden:
# 1. Kustomize secretGenerator (aanbevolen)
# 2. Sealed Secrets
# 3. External Secrets Operator met Vault/AWS Secrets Manager
# 4. Handmatig aanmaken: kubectl create secret generic ...
#
# Gebruik: kubectl create secret generic hienfeld-secrets \
#          --from-literal=POSTGRES_URL='postgres://...' \
#          --from-literal=SECRET_KEY='...' \
#          --namespace vb-converter
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hienfeld-secrets
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-api
    app.kubernetes.io/component: backend
type: Opaque
# PLACEHOLDER VALUES - VERVANG IN PRODUCTIE!
# Base64 encoded waarden (echo -n 'waarde' | base64)
stringData:
  # --- Database Connectie ---
  # Format: postgresql://user:password@host:port/database
  POSTGRES_URL: "postgresql://hienfeld:CHANGE_ME_IN_PRODUCTION@hienfeld-postgres:5432/hienfeld"

  # --- Applicatie Secret Key ---
  # Gebruik voor JWT tokens en sessies
  # Genereer: openssl rand -hex 32
  SECRET_KEY: "CHANGE_ME_GENERATE_WITH_openssl_rand_hex_32"

  # --- OpenAI API Key (optioneel) ---
  # Alleen nodig als AI features ingeschakeld zijn (VITE_FEATURE_AI=true)
  OPENAI_API_KEY: ""

---
# =============================================================================
# POSTGRESQL SECRETS
# =============================================================================
# Credentials voor de PostgreSQL database.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: hienfeld-postgres-secrets
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Database admin credentials
  POSTGRES_USER: "hienfeld"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "hienfeld"
