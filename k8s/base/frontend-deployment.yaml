# =============================================================================
# VB CONVERTER - FRONTEND DEPLOYMENT
# =============================================================================
# React/Vite frontend served via Nginx.
# Image: hienfeld-frontend:latest
# Poort: 80
#
# De frontend is een statische SPA build, served door Nginx.
# API calls gaan via de Ingress naar de backend.
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hienfeld-frontend
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: vb-converter
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hienfeld-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hienfeld-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx user
        fsGroup: 101

      containers:
        - name: nginx
          image: hienfeld-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Resource limits (frontend is lightweight)
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Volume mounts
          volumeMounts:
            # Custom nginx config
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            # Nginx cache en temp directories
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: nginx-config
          configMap:
            name: hienfeld-frontend-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}

      # Spread pods over nodes voor HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hienfeld-frontend

---
# =============================================================================
# FRONTEND SERVICE
# =============================================================================
# ClusterIP service voor interne communicatie.
# Toegankelijk via: hienfeld-frontend.vb-converter.svc.cluster.local:80
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: hienfeld-frontend
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: hienfeld-frontend

---
# =============================================================================
# POD DISRUPTION BUDGET
# =============================================================================
# Garandeert minimaal 1 pod beschikbaar tijdens maintenance/upgrades.
# =============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hienfeld-frontend-pdb
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hienfeld-frontend
