# =============================================================================
# VB CONVERTER - CONFIGMAP
# =============================================================================
# Niet-gevoelige configuratie voor de backend applicatie.
# Gevoelige data (secrets) staat in secrets.yaml.
#
# Wijzig deze waarden per omgeving via Kustomize overlays.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: hienfeld-config
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-api
    app.kubernetes.io/component: backend
data:
  # --- Applicatie Instellingen ---
  ENVIRONMENT: "production"
  DEBUG: "false"
  APP_VERSION: "3.1.0"

  # --- Server Configuratie ---
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # --- CORS (pas aan voor productie!) ---
  # Komma-gescheiden lijst van toegestane origins
  ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:3000"

  # --- NLP Instellingen (lokaal, geen externe API) ---
  SPACY_MODEL: "nl_core_news_md"
  SEMANTIC_ENABLED: "true"
  EMBEDDING_MODEL: "intfloat/multilingual-e5-large-instruct"

  # --- Logging ---
  # LOG_LEVEL: DEBUG, INFO, WARNING, ERROR
  # LOG_FORMAT: text (leesbaar) of json (gestructureerd voor ELK/Loki)
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # --- Rate Limiting ---
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"

  # --- Database ---
  # Voor SQLite fallback (niet aanbevolen voor productie)
  # DATABASE_URL wordt via secret ingesteld voor PostgreSQL

  # --- Feature Flags ---
  VITE_FEATURE_AI: "false"

---
# =============================================================================
# FRONTEND CONFIGMAP
# =============================================================================
# Configuratie voor de frontend nginx container.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: hienfeld-frontend-config
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-frontend
    app.kubernetes.io/component: frontend
data:
  # Nginx configuratie voor SPA routing
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip compressie
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        gzip_min_length 1000;

        # Health check endpoint voor K8s probes
        location /health {
            access_log off;
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        # API proxy naar backend (optioneel - kan ook via Ingress)
        # location /api {
        #     proxy_pass http://hienfeld-api:8000;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # SPA fallback - alle routes naar index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
