# =============================================================================
# VB CONVERTER - POSTGRESQL STATEFULSET
# =============================================================================
# PostgreSQL database met persistent storage.
#
# BELANGRIJK: Dit is voor development/staging. Voor productie wordt aangeraden:
# - Managed database service (AWS RDS, Azure Database, Cloud SQL)
# - Of een operator zoals CloudNativePG, Zalando Postgres Operator
#
# Storage: 5Gi PersistentVolumeClaim
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hienfeld-postgres
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vb-converter
spec:
  serviceName: hienfeld-postgres
  replicas: 1  # Single instance (voor HA gebruik een operator)
  selector:
    matchLabels:
      app.kubernetes.io/name: hienfeld-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hienfeld-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999  # postgres user
        fsGroup: 999

      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          # Resource limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Environment variabelen uit Secret
          envFrom:
            - secretRef:
                name: hienfeld-postgres-secrets

          # Extra PostgreSQL configuratie
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # Liveness probe
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Volume mounts
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      volumes:
        - name: postgres-init
          configMap:
            name: hienfeld-postgres-init
            optional: true

  # Persistent Volume Claim template
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: hienfeld-postgres
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        # Uncomment en pas aan voor specifieke storage class
        # storageClassName: standard

---
# =============================================================================
# POSTGRESQL SERVICE
# =============================================================================
# Headless service voor StatefulSet DNS.
# Toegankelijk via: hienfeld-postgres.vb-converter.svc.cluster.local:5432
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: hienfeld-postgres
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: hienfeld-postgres

---
# =============================================================================
# POSTGRESQL INIT CONFIGMAP (optioneel)
# =============================================================================
# SQL scripts die uitgevoerd worden bij eerste start van de database.
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: hienfeld-postgres-init
  namespace: vb-converter
  labels:
    app.kubernetes.io/name: hienfeld-postgres
    app.kubernetes.io/component: database
data:
  01-init-extensions.sql: |
    -- Activeer nuttige PostgreSQL extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";  -- Voor fuzzy text search

    -- Log succesvolle initialisatie
    DO $$
    BEGIN
      RAISE NOTICE 'Database extensions geinitialiseerd';
    END $$;
